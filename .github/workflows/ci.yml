name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  cli:
    name: Go CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache: true
          cache-dependency-path: cli/go.sum
      - name: Build
        run: go build ./...
        working-directory: cli
      - name: Test
        run: go test ./...
        working-directory: cli

  raycast:
    name: Raycast extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: raycast/package-lock.json
      - name: Test
        run: npm ci && npm test
        working-directory: raycast

  firefox-addon:
    name: Firefox add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firefox-addon/package-lock.json
      - name: Test
        run: npm ci && npm test
        working-directory: firefox-addon

  mcp-server:
    name: Zen MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - name: Build
        run: npm ci && npm run build
        working-directory: mcp-server
      - name: Test
        run: npm test
        working-directory: mcp-server
